<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firediting | Video Editing Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: white; font-family: sans-serif; }
        .gradient-text { background: linear-gradient(90deg, #ff4d4d, #f97316); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; }
        .video-container video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 12px; }
        .btn-hover:hover { transform: translateY(-3px); transition: 0.3s; }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header class="p-6 flex justify-between items-center max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold gradient-text">Firediting</h1>
        <nav class="hidden md:block space-x-6">
            <a href="#work" class="hover:text-orange-500">Work</a>
            <a href="#thumbnails" class="hover:text-orange-500">Thumbnails</a>
            <a href="#contact" class="hover:text-orange-500">Contact</a>
        </nav>
    </header>

    <!-- Hero / Featured Video -->
    <section class="max-w-5xl mx-auto p-4 mb-12">
        <h2 class="text-xl mb-4 font-semibold text-gray-400 uppercase tracking-widest">Featured Work</h2>
        <div class="video-container shadow-2xl border border-gray-800">
            <!-- Replace 'featured.mp4' with your actual video filename in GitHub -->
            <video controls poster="thumbnail-placeholder.jpg">
                <source src="featured.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
    </section>

    <!-- Softwares Section -->
    <section class="bg-slate-900 py-10 mb-12">
        <div class="max-w-5xl mx-auto px-4 text-center">
            <p class="text-gray-400 mb-4">Tools I Master</p>
            <div class="flex flex-wrap justify-center gap-6 text-xl font-bold">
                <span class="bg-gray-800 px-4 py-2 rounded-lg border border-blue-500">Premiere Pro</span>
                <span class="bg-gray-800 px-4 py-2 rounded-lg border border-purple-500">After Effects</span>
                <span class="bg-gray-800 px-4 py-2 rounded-lg border border-green-500">CapCut</span>
            </div>
        </div>
    </section>

    <!-- Reels Grid (5-7 Videos) -->
    <section id="work" class="max-w-6xl mx-auto p-4 mb-16">
        <h2 class="text-3xl font-bold mb-8 text-center">Best <span class="text-orange-500">Reels</span></h2>
        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <!-- Copy this block for each reel (Total 5-7) -->
            <div class="rounded-xl overflow-hidden bg-gray-800">
                <video class="w-full aspect-[9/16] object-cover" controls>
                    <source src="reel1.mp4" type="video/mp4">
                </video>
            </div>
            <div class="rounded-xl overflow-hidden bg-gray-800">
                <video class="w-full aspect-[9/16] object-cover" controls>
                    <source src="reel2.mp4" type="video/mp4">
                </video>
            </div>
            <!-- Add more reels here -->
        </div>
    </section>

    <!-- Thumbnail Section -->
    <section id="thumbnails" class="max-w-6xl mx-auto p-4 mb-16">
        <h2 class="text-3xl font-bold mb-8 text-center">Thumbnail <span class="text-orange-500">Designs</span></h2>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <img src="thumb1.jpg" alt="Thumbnail" class="rounded-lg shadow-lg hover:scale-105 transition">
            <img src="thumb2.jpg" alt="Thumbnail" class="rounded-lg shadow-lg hover:scale-105 transition">
            <img src="thumb3.jpg" alt="Thumbnail" class="rounded-lg shadow-lg hover:scale-105 transition">
        </div>
    </section>

    <!-- Contact Section / CTA -->
    <footer id="contact" class="bg-slate-900 py-20 px-4 text-center">
        <h2 class="text-4xl font-bold mb-4">Let's Create Something <span class="text-orange-500">Epic!</span></h2>
        <p class="text-gray-400 mb-8">Click below to start a conversation</p>
        
        <div class="flex flex-col md:flex-row justify-center items-center gap-4">
            <!-- WhatsApp Button -->
            <a href="https://wa.me..." 
               class="btn-hover bg-green-600 hover:bg-green-700 text-white px-8 py-4 rounded-full font-bold flex items-center gap-2 text-lg shadow-lg">
                WhatsApp Me
            </a>

            <!-- Email Button -->
            <a href="mailto:firediting07@gmail.com" 
               class="btn-hover bg-white text-black px-8 py-4 rounded-full font-bold flex items-center gap-2 text-lg shadow-lg">
                Send Email
            </a>
        </div>
        <p class="mt-12 text-gray-600">© 2024 Firediting | All Rights Reserved</p>
    </footer>

</body>
</html>
